<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CatCut Bridge</title>
<style>
  body { margin: 10px; font: 12px/1.5 system-ui, sans-serif; background: #232323; color: #c8c8c8; }
  b { color: #fff; }
  .err { color: #ff8a80; }
</style>
</head>
<body>
<div><b>CatCut Bridge</b> <span id="v"></span></div>
<div id="s">starting…</div>
<div id="e" class="err"></div>
<script>
(function () {
  var cep = window.__adobe_cep__;
  var show = function (id, text) { var el = document.getElementById(id); if (el) el.textContent = text; };
  try {
    // getSystemPath(1) = extension folder, as a file URL (same decoding as Adobe's CSInterface):
    // file:///C:/… → C:/…, file:///Users/… → /Users/… (macOS keeps its leading slash)
    var ext = decodeURI(cep.getSystemPath('extension')).replace(/^file:\/\/(\/(?=[A-Za-z]:))?/, '');
    var path = require('path'), fs = require('fs'), os = require('os');
    // the version CatCut compares against: read once, the code below is what this Premiere session runs
    var VERSION = JSON.parse(fs.readFileSync(path.join(ext, 'package.json'), 'utf8')).version;
    show('v', VERSION);
    var core = require(path.join(ext, 'bridge-core.js'));
    var bridge = core.createBridge({
      // same folder CatCut uses (premiere.ts defaultQueueDir): not under TEMP, which cleanup tools empty
      fs: fs, path: path, pid: process.pid, version: VERSION,
      dir: process.env.CATCUT_PREMIERE_BRIDGE_DIR || (function () {
        var local = process.platform === 'darwin' ? path.join(os.homedir(), 'Library', 'Application Support') : process.env.LOCALAPPDATA;
        return local && /^[\x20-\x7e]+$/.test(local) ? path.join(local, 'CatCut', 'bridge') : path.join(os.tmpdir(), 'catcut-premiere-bridge');
      })(),
      hostFile: path.join(ext, 'host.jsx'),
      evalScript: function (script) { return new Promise(function (resolve) { cep.evalScript(script, resolve); }); },
      onStatus: function (st) {
        show('s', st.serving
          ? 'connected · ' + (st.project ? st.project.name : 'no project') + ' · ' + st.handled + ' job(s)' + (st.busy ? ' · working: ' + st.busy.action : '')
          : 'standing by (another CatCut bridge is serving)');
        show('e', st.lastError ? 'last error: ' + st.lastError : '');
      },
    });
    bridge.start();
    window.addEventListener('unload', function () { bridge.stop(); });
  } catch (e) {
    show('s', 'not running');
    show('e', String(e && e.message || e));
  }
})();
</script>
</body>
</html>
